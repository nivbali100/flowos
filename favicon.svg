<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>

  <!-- ── BACKGROUND GRADIENTS ─────────────────────────── -->
  <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="#0b081c"/>
    <stop offset="100%" stop-color="#160b38"/>
  </linearGradient>

  <radialGradient id="ambient" cx="256" cy="256" r="230" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="#301870" stop-opacity="0.75"/>
    <stop offset="60%"  stop-color="#1a0a48" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#0b081c" stop-opacity="0"/>
  </radialGradient>

  <!-- warm ambient glow near bottom-left (origin of journey) -->
  <radialGradient id="startGlow" cx="115" cy="400" r="160" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="#f5c224" stop-opacity="0.14"/>
    <stop offset="100%" stop-color="#0b081c" stop-opacity="0"/>
  </radialGradient>

  <!-- cool ambient glow near top-right (destination) -->
  <radialGradient id="endGlow" cx="400" cy="112" r="160" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="#ffaa40" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#0b081c" stop-opacity="0"/>
  </radialGradient>

  <!-- ── FLOW PATH GRADIENT (gold → amber) ─────────── -->
  <linearGradient id="flowGrad" x1="115" y1="400" x2="405" y2="115" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="#f7c520"/>
    <stop offset="48%"  stop-color="#ff8d38"/>
    <stop offset="100%" stop-color="#ffb045"/>
  </linearGradient>

  <!-- subtle inner highlight on the stroke -->
  <linearGradient id="flowHighlight" x1="115" y1="400" x2="405" y2="115" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="#ffe580" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#fff3c4" stop-opacity="0.3"/>
  </linearGradient>

  <!-- ── FILTERS ────────────────────────────────────── -->

  <!-- very wide diffuse glow (outer aura) -->
  <filter id="aura" x="-70%" y="-70%" width="240%" height="240%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="32"/>
  </filter>

  <!-- medium glow -->
  <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <!-- soft glow (for fine elements) -->
  <filter id="softGlow" x="-25%" y="-25%" width="150%" height="150%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <!-- clip to rounded rect -->
  <clipPath id="iconClip">
    <rect width="512" height="512" rx="115"/>
  </clipPath>

</defs>

<!-- ── BACKGROUND ────────────────────────────────────── -->
<rect width="512" height="512" rx="115" fill="url(#bg)"/>
<rect width="512" height="512" rx="115" fill="url(#ambient)"/>
<rect width="512" height="512" rx="115" fill="url(#startGlow)"/>
<rect width="512" height="512" rx="115" fill="url(#endGlow)"/>

<!-- ── MOUNTAIN SILHOUETTES (subliminal הפסגה) ────────── -->
<g clip-path="url(#iconClip)" opacity="1">
  <!-- back mountain (slightly left) -->
  <polygon points="168,210 262,68 356,210" fill="#1d1052" opacity="0.55"/>
  <!-- front mountain (slightly right, taller) -->
  <polygon points="220,210 320,60 420,210" fill="#21135e" opacity="0.42"/>
  <!-- ground plane hint -->
  <rect x="0" y="205" width="512" height="10" fill="#1a0d50" opacity="0.2"/>
</g>

<!-- ── FLOWING PATH ───────────────────────────────────── -->

<!-- Layer 1 — diffuse aura (widest, most transparent) -->
<path d="M 115,400 C 95,302 152,252 214,250 C 300,248 392,196 405,115"
  fill="none"
  stroke="#ff9030"
  stroke-width="100"
  stroke-linecap="round"
  opacity="0.13"
  filter="url(#aura)"
/>

<!-- Layer 2 — soft mid-halo -->
<path d="M 115,400 C 95,302 152,252 214,250 C 300,248 392,196 405,115"
  fill="none"
  stroke="url(#flowGrad)"
  stroke-width="60"
  stroke-linecap="round"
  opacity="0.22"
  filter="url(#glow)"
/>

<!-- Layer 3 — core path (main stroke) -->
<path d="M 115,400 C 95,302 152,252 214,250 C 300,248 392,196 405,115"
  fill="none"
  stroke="url(#flowGrad)"
  stroke-width="40"
  stroke-linecap="round"
  filter="url(#glow)"
/>

<!-- Layer 4 — inner highlight streak (luxury sheen) -->
<path d="M 115,400 C 95,302 152,252 214,250 C 300,248 392,196 405,115"
  fill="none"
  stroke="url(#flowHighlight)"
  stroke-width="14"
  stroke-linecap="round"
  opacity="0.55"
/>

<!-- ── JOURNEY NODES ──────────────────────────────────── -->

<!-- START — origin of the journey (bottom-left) -->
<!-- aura ring -->
<circle cx="115" cy="400" r="52" fill="#f7c520" opacity="0.12" filter="url(#aura)"/>
<!-- outer ring -->
<circle cx="115" cy="400" r="34" fill="none" stroke="#f7c520" stroke-width="2.5" opacity="0.5"/>
<!-- filled circle -->
<circle cx="115" cy="400" r="26" fill="#f7c520" filter="url(#softGlow)"/>
<!-- inner bright core -->
<circle cx="115" cy="400" r="13" fill="#fffbe6"/>
<!-- micro specular highlight -->
<circle cx="109" cy="393" r="5" fill="#ffffff" opacity="0.7"/>

<!-- END — the summit / הפסגה (top-right) -->
<!-- aura ring -->
<circle cx="405" cy="115" r="44" fill="#ffb045" opacity="0.12" filter="url(#aura)"/>
<!-- outer ring -->
<circle cx="405" cy="115" r="28" fill="none" stroke="#ffb045" stroke-width="2.5" opacity="0.5"/>
<!-- filled circle -->
<circle cx="405" cy="115" r="21" fill="#ffb045" filter="url(#softGlow)"/>
<!-- inner bright core -->
<circle cx="405" cy="115" r="9.5" fill="#fff6e0"/>
<!-- micro specular highlight -->
<circle cx="400" cy="109" r="4" fill="#ffffff" opacity="0.65"/>

<!-- ── SPARKLE ACCENTS ────────────────────────────────── -->

<!-- 4-point star near mountains peak (top-center) -->
<g filter="url(#softGlow)" opacity="0.65">
  <path d="M 255,104
           L 258.5,94  L 262,104
           L 272,107.5 L 262,111
           L 258.5,121 L 255,111
           L 245,107.5 Z"
    fill="#f7c520"/>
</g>

<!-- small 4-point star (upper-right area) -->
<g filter="url(#softGlow)" opacity="0.45">
  <path d="M 358,162
           L 360.5,155 L 363,162
           L 370,164.5 L 363,167
           L 360.5,174 L 358,167
           L 351,164.5 Z"
    fill="#ffb045"/>
</g>

<!-- tiny sparkle dot (lower mid) -->
<circle cx="310" cy="306" r="4.5" fill="#ff8d38" opacity="0.38" filter="url(#softGlow)"/>

<!-- another tiny dot (path midpoint accent) -->
<circle cx="214" cy="250" r="7" fill="#ff8d38" opacity="0.25" filter="url(#softGlow)"/>

<!-- ── BORDER SHEEN (luxury edge highlight) ─────────── -->
<rect width="512" height="512" rx="115"
  fill="none"
  stroke="url(#flowHighlight)"
  stroke-width="1.5"
  opacity="0.18"
/>

</svg>
